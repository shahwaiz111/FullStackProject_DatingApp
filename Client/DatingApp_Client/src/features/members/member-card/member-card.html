@if(member(); as member){
    <div routerLink="/member/{{member.id}}" class="card cursor-pointer transition-all duration-300 ease-in-out transform hover:-translate-y-2" >
    <img src="{{member?.imageUrl}}" alt="/user.jpg" alt="{{member.displayName}}" class="rounded-lg">
    <div class="card-actions bg-black z-50 absolute-bottom-0 w-full px-3 py-1 rounded-b-sm bg-linear-to-t from-black via-black/75 to black/0 "></div>
     <span class="font-semibold">{{member.displayName}}, 24</span>
     <span class="text-sm">{{member.city}}</span>   

</div>
}
