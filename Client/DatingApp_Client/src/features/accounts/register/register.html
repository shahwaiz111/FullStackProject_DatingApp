<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <div class="card-title justify-center text-3xl text-primary">Sign up</div>
    <div class="card-body w-full">
        
        <ul class="steps">
            <li class="step step-primary">Credentials</li>
            <li class="step" [class.step-primary]="currentStep() === 2">Profile</li>
        </ul>

        @if (currentStep() === 1){
             <form [formGroup]="credentialsForm" class="flex flex-col gap-4 w-full steps">
                <!--Much cleaner way.. we've got a central place now where we can provide validation and so on..-->
            <app-text-input class="mt-2" label="Email" formControlName="email"></app-text-input>
            <app-text-input label="Display Name" formControlName="displayName"></app-text-input>
            <app-text-input label="Password" formControlName="password" type="password"></app-text-input>
            <app-text-input label="Confirm Password" formControlName="confirmPassword" type="password"></app-text-input>
            <div class="flex items-center justify-end gap-3">
                <button (click)="cancel()" type="button" class="btn">Cancel</button>
                <button [disabled]="!credentialsForm.valid" (click)="nextStep()" class="btn btn-primary" type="button">Next</button>
            </div>
        </form>
        }
        
        @if (currentStep() === 2){
            <form [formGroup]="profileForm" class="flex flex-col w-full gap-4 steps">
                <!-- <div>Profile form goes here..</div> -->
                <app-text-input class="mt-2" label="Gender" formControlName="gender"></app-text-input>
                <app-text-input [maxDate]="getMaxDate()" type="date" label="Date of Birth" formControlName="dateOfBirth"></app-text-input>
                <app-text-input label="City" formControlName="city"></app-text-input>
                <app-text-input label="Country" formControlName="country"></app-text-input>
                <div class="flex items-center justify-end gap-3">
                <button (click)="prevStep()" type="button" class="btn">Back</button>
                <button [disabled]="!profileForm.valid" (click)="register()" class="btn btn-primary" type="button">Register</button>
            </div>
            </form>
        }

                @if(registerForm.controls['displayName'].invalid && registerForm.controls['displayName'].touched){
                    <div class="text-error">Display name is required.</div>
                    
                }
            </label> -->

            </label> -->
            <!-- <label class="floating-label">
                <span>Confirm Password</span>
                <input type="password" class="input w-full" formControlName="confirmPassword" placeholder="Confirm Password">
            </label> -->

                @for (member of membersFromHome(); track $index) {
                    <option value="{{member.id}}">{{member.displayName}}</option>
                }
            </select> -->

            
    </div>

    @if(validationErrors().length > 0){
        <div class="mt-5 bg-gray-200 rounded-2xl w-1/2 p-3 mx-auto">
            <ul class="flex flex-col text-error space-y-1">
                @for (error of validationErrors(); track $index) {
                    <li>{{error}}</li>
                }
            </ul>
        </div>
    }
